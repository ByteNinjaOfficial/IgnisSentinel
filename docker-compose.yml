services:
  # ==========================================================
  # IgnisSentinel (GPU Accelerated - NVIDIA CUDA)
  # Default: requires NVIDIA GPU + NVIDIA Container Toolkit
  # ==========================================================
  ignissentinel:
    image: byteninja16/ignissentinel:latest
    container_name: ignissentinel
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persistent bind mounts: user configuration, SQLite DB, model weights, and logs
      - ./Program/config:/app/Program/config
      - ./Program/data:/app/Program/data
      - ./Program/logs:/app/Program/logs
      - ./Program/model:/app/Program/model
    env_file:
      - path: ./Program/config/.env
        required: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
